name: Build and deploy

# Every push to main builds the site and, only if the build succeeds, publishes it.
# A failed build leaves the previous version of the site live and opens a quiet alert issue that
# mentions only the person who pushed. escalate.yml mentions the team if it stays open for days;
# the issue closes itself on the next good deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Build first so a content mistake shows the plain-language error message in the log.
      - name: Build the site
        run: |
          set -o pipefail
          python build.py --base-path "/${{ github.event.repository.name }}" 2>&1 | tee ci.log

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee -a ci.log

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Alert about the failed build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m ccnl.alerts open --label build-failure
          --title "The website build failed"
          --summary "The website did **not** update because the build or tests failed."
          --log-file ci.log

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Close the alert issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m ccnl.alerts close --label build-failure
          --comment "Fixed: the website was deployed successfully (${{ github.sha }})."

      - name: Alert about the failed deploy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m ccnl.alerts open --label build-failure
          --title "The website build failed"
          --summary "The site built but could not be **deployed** to GitHub Pages. Re-run the workflow from the Actions tab; if it keeps failing, check https://www.githubstatus.com."
