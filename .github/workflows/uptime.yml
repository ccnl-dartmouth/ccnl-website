name: Uptime check

# Backup to an external monitor (see docs/OPERATIONS.md): every 6 hours, fetch the live site and open
# an issue if it does not answer. Set the repository variable SITE_URL if the address ever changes.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  uptime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the site
        id: fetch
        continue-on-error: true
        run: |
          url="${SITE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}"
          echo "Checking $url"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 20 --max-time 30 "$url" | grep -q "<title>"

      - name: Open or update the site-down issue
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m ccnl.alerts open --label site-down
          --title "The website is not responding"
          --summary "The uptime check could not load the website. Check https://www.githubstatus.com, then the Pages settings and the latest deploy in the Actions tab."

      - name: Close the site-down issue
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m ccnl.alerts close --label site-down
          --comment "The website is responding again."
