{% extends "base.html" %}
{% block title %}Research &middot; {{ lab.name }}{% endblock %}
{% block content %}
<h1>Research</h1>
{% for t in site.research %}
<section class="theme" id="{{ t.slug }}">
  {% if t.image %}<img class="theme-fig" src="{{ url('images/' ~ t.image) }}" alt="{{ t.image_alt }}" loading="lazy">{% endif %}
  <div class="theme-text">
    <h2>{{ t.title }}</h2>
    <div class="prose">{{ t.html|safe }}</div>
  </div>
</section>
{% else %}
<p>Research themes will appear here.</p>
{% endfor %}
{% endblock %}
